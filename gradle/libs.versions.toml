# gradle/libs.versions.toml

[versions]
# Toolchain
kotlin          = "2.4.10"
agp             = "9.3.2"

# Compose
composeBom      = "2026.08.00"

# AndroidX TV
tvMaterial      = "1.1.0"
tvFoundation    = "1.0.0"

# Navigation
navigation      = "2.10.0"

# Lifecycle / ViewModel
lifecycle       = "2.11.0"

# Coroutines
coroutines      = "1.11.0"

# Media3 / ExoPlayer
media3          = "1.11.0"

# Networking
retrofit        = "3.0.0"

# Imágenes
coil            = "3.6.0"

# Persistencia
datastore       = "1.2.1"

# Testing
junit           = "4.13.2"
mockito         = "5.23.0"
mockitoKotlin   = "6.3.0"
kotlinxCoroutinesTest = "1.11.0"

[libraries]
compose-bom             = { group = "androidx.compose",          name = "compose-bom",                    version.ref = "composeBom" }
compose-ui              = { group = "androidx.compose.ui",       name = "ui" }
compose-material3       = { group = "androidx.compose.material3",name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling      = { group = "androidx.compose.ui",       name = "ui-tooling" }
compose-ui-tooling-prev = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
tv-material             = { group = "androidx.tv",               name = "tv-material",                    version.ref = "tvMaterial" }
tv-foundation           = { group = "androidx.tv",               name = "tv-foundation",                  version.ref = "tvFoundation" }
navigation-compose      = { group = "androidx.navigation",       name = "navigation-compose",             version.ref = "navigation" }
lifecycle-viewmodel     = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
lifecycle-runtime       = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",          version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
coroutines-android      = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",     version.ref = "coroutines" }
media3-exoplayer        = { group = "androidx.media3",           name = "media3-exoplayer",               version.ref = "media3" }
media3-hls              = { group = "androidx.media3",           name = "media3-exoplayer-hls",           version.ref = "media3" }
media3-ui               = { group = "androidx.media3",           name = "media3-ui",                     version.ref = "media3" }
media3-okhttp           = { group = "androidx.media3",          name = "media3-datasource-okhttp",       version.ref = "media3" }
retrofit                = { group = "com.squareup.retrofit2",    name = "retrofit",                       version.ref = "retrofit" }
retrofit-gson           = { group = "com.squareup.retrofit2",    name = "converter-gson",                 version.ref = "retrofit" }
coil-compose            = { group = "io.coil-kt.coil3",         name = "coil-compose",                   version.ref = "coil" }
coil-okhttp             = { group = "io.coil-kt.coil3",         name = "coil-network-okhttp",             version.ref = "coil" }
datastore               = { group = "androidx.datastore",        name = "datastore-preferences",          version.ref = "datastore" }

# Testing
junit                   = { group = "junit",                     name = "junit",                          version.ref = "junit" }
mockito-core            = { group = "org.mockito",               name = "mockito-core",                   version.ref = "mockito" }
mockito-kotlin          = { group = "org.mockito.kotlin",        name = "mockito-kotlin",                 version.ref = "mockitoKotlin" }
coroutines-test         = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-test",        version.ref = "kotlinxCoroutinesTest" }

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
