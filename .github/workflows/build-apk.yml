name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: murine
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | manageress --licenses > /dev/null || true

      - name: Install required SDK platform
        run: manageress "platforms;android-37.0" "build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: ./gradlew assembleDebug -PTMDB_TOKEN="$TMDB_TOKEN"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: visiontv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
